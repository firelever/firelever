# Maps this repo's agent for Plures: https://plures.si/docs#map-github
# plures-workflow: 2
# Claude Code reads the code on this runner. Only the map is sent to Plures, with a key
# that can do nothing but upload this app's map (and start a map run for it).
# Plures maps it for you: the first map is free, then each costs what the run uses plus 30%,
# at most $5, from your Plures credit. Mapping uses Claude by Anthropic: your code passes
# through for the run and isn't kept. To map free with your own Anthropic key, add an
# ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret.
name: Plures map (firelever)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.css"
      - "**/*.scss"
      - "test/**"
      - "tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
  workflow_dispatch:
  repository_dispatch: # Map now, from the Plures dashboard
    types: [plures-map-firelever]

concurrency:
  group: plures-map-firelever
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Map and upload
        env:
          PLURES_API_KEY: ${{ secrets.PLURES_MAP_KEY_FIRELEVER_7 }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then export ANTHROPIC_API_KEY="$ANTHROPIC_KEY"; fi
          if [ -n "$CLAUDE_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_TOKEN"; fi
          npx -y plures@latest map --app firelever
